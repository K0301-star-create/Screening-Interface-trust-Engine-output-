<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard and screening · Desk editor · Taylor &amp; Francis</title>
<style>
:root{
  --indigo:#0C1B33; --ultramarine:#1240CE; --cornflower:#4D56F6; --vista:#A2BBFB;
  --saffron:#EFAC00; --saffron-dark:#B44B1E; --carbon:#2B3750; --slate:#404E6B;
  --new-neutral:#E9EEFE; --saffron-neutral:#FAF6C7; --green:#1a8a5a; --green-dark:#17724a;
  --navy:var(--indigo); --sand:var(--new-neutral); --plane:#EDF1FD; --surface-1:#FFFFFF;
  --text-primary:var(--carbon); --text-secondary:var(--slate); --text-muted:#6E7C99;
  --hairline:#DEE4F4; --axis:#C3CCE4; --crit:#8C3714;
  --font:Aptos,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --display:"Aptos Display",Aptos,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --radius:4px; --maxw:1380px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--text-primary);font-family:var(--font);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--display);letter-spacing:-.01em;margin:0;font-weight:700}
h3{margin:0;font-weight:600;line-height:1.25}
p{margin:0 0 10px;color:var(--text-secondary)}
a{color:var(--ultramarine)}
.small{font-size:12.5px}.muted{color:var(--text-muted)}.tnum{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit}button{cursor:pointer}

.topbar{position:sticky;top:0;z-index:50;background:var(--navy);height:58px;padding:0 24px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-family:var(--display);text-decoration:none}
.brand .dot{width:7px;height:20px;border-radius:1px;background:var(--vista)}
.brand .bt{font-size:15px;font-weight:700;white-space:nowrap}
.navlinks{display:flex;gap:2px;margin-left:8px;flex:1}
.navlinks a{text-decoration:none;color:rgba(255,255,255,.74);font-size:13px;padding:6px 12px;border-radius:3px}
.navlinks a:hover{color:#fff;background:rgba(255,255,255,.10)}
.navlinks a[aria-current="page"]{color:#fff;font-weight:700;background:rgba(255,255,255,.14)}
.me{display:flex;align-items:center;gap:9px;flex:none;padding-left:14px;border-left:1px solid rgba(255,255,255,.18)}
.me .av{width:30px;height:30px;border-radius:50%;background:var(--vista);color:var(--indigo);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.me .mn{font-size:12.5px;color:#fff;font-weight:600;line-height:1.2}
.me .mr{font-size:11px;color:rgba(255,255,255,.58);line-height:1.2}

.wrap{max-width:var(--maxw);margin:0 auto;padding:22px 24px 70px}
.kicker{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ultramarine);margin-bottom:6px}
.card{background:var(--surface-1);border:1px solid var(--hairline);border-radius:var(--radius);padding:16px 18px}
.card.pad0{padding:0;overflow:hidden}
.cardhead{background:var(--sand);border-bottom:1px solid var(--hairline);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cardhead h3{font-size:13.5px;font-weight:700;color:var(--navy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:var(--surface-1);border:1px solid var(--axis);border-radius:3px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--text-secondary);white-space:nowrap}
.btn:hover{border-color:var(--navy);color:var(--navy)}
.btn.pri{background:var(--ultramarine);border-color:var(--ultramarine);color:#fff}
.btn.pri:hover{background:#0E34A8;border-color:#0E34A8;color:#fff}
.btn.warn{background:#fff;border-color:var(--saffron-dark);color:var(--saffron-dark)}
.btn.crit{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.pill{display:inline-flex;align-items:center;border-radius:2px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;white-space:nowrap}
.pill.ok{background:rgba(26,138,90,.12);color:var(--green-dark)}
.pill.warn{background:var(--saffron-neutral);color:#8A5A0E}
.pill.crit{background:rgba(140,55,20,.10);color:var(--crit)}
.pill.mute{background:var(--new-neutral);color:var(--text-muted)}
.pill.info{background:rgba(18,64,206,.10);color:#0E34A8}

.head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.head .ht{flex:1;min-width:280px}
.head h1{font-size:24px;color:var(--navy)}
.head p{margin:4px 0 0;font-size:13px}
.lay{display:grid;grid-template-columns:380px minmax(0,1fr);gap:18px;align-items:start;margin-top:16px}
@media(max-width:1000px){.lay{grid-template-columns:1fr}}

/* queue */
.qtabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--hairline);flex-wrap:wrap}
.qtabs button{border:1px solid var(--axis);background:#fff;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600;color:var(--text-secondary)}
.qtabs button[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
.qi{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--hairline);padding:12px 14px;position:relative}
.qi:hover{background:#FAFBFF}
.qi[aria-pressed="true"]{background:rgba(18,64,206,.05);box-shadow:inset 3px 0 0 var(--ultramarine)}
.qi .t{font-weight:700;color:var(--navy);line-height:1.35;font-size:13.5px}
.qi .m{font-size:11.5px;color:var(--text-muted);margin-top:2px}
.qi .r{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap}
.qi .res{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--text-muted)}

/* report */
.rhd{padding:18px 22px;border-bottom:1px solid var(--hairline)}
.rhd h2{font-size:20px;color:var(--navy);line-height:1.3}
.rhd .meta{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:12.5px;color:var(--text-muted);margin-top:6px}
.rhd .meta b{color:var(--text-secondary);font-weight:600}
.reco{display:flex;gap:14px;align-items:flex-start;padding:16px 22px;border-bottom:1px solid var(--hairline)}
.reco .lamp{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.reco .lamp.ok{background:var(--green)}.reco .lamp.warn{background:var(--saffron-dark)}.reco .lamp.crit{background:var(--crit)}
.reco h3{font-size:15px;color:var(--navy)}
.reco p{margin:3px 0 0;font-size:13px}
.sec{padding:16px 22px;border-bottom:1px solid var(--hairline)}
.sec:last-child{border-bottom:0}
.sec > h3{font-size:14px;color:var(--navy);display:flex;align-items:center;gap:10px}
.sec > .sub{font-size:12.5px;color:var(--text-muted);margin:2px 0 10px}
.chk{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--hairline);font-size:13px;align-items:start}
.chk:first-of-type{border-top:0}
.chk .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;margin-top:1px}
.chk .ic.ok{background:var(--green)}.chk .ic.warn{background:var(--saffron-dark)}.chk .ic.crit{background:var(--crit)}
.chk .lab{font-weight:600;color:var(--text-primary)}
.chk .det{font-size:12.5px;color:var(--text-muted)}
.chk .when{font-size:11.5px;color:var(--text-muted);white-space:nowrap}
/* trust engine */
.tscore{display:flex;align-items:center;gap:16px;padding:12px 14px;border-radius:var(--radius);background:var(--sand);margin-bottom:10px}
.tscore .n{font-family:var(--display);font-size:32px;font-weight:700;color:var(--navy);line-height:1}
.tscore .n small{font-size:13px;font-weight:600;color:var(--text-muted)}
.tscore .tx{font-size:12.5px;color:var(--text-secondary)}
.tscore .tx b{color:var(--navy)}
.sig{display:grid;grid-template-columns:minmax(0,1.1fr) 150px minmax(0,1.4fr);gap:14px;padding:11px 0;border-top:1px solid var(--hairline);align-items:start;font-size:13px}
.sig:first-of-type{border-top:0}
@media(max-width:900px){.sig{grid-template-columns:1fr}}
.sig .nm{font-weight:600;color:var(--text-primary)}
.sig .nm span{display:block;font-weight:400;font-size:12px;color:var(--text-muted)}
.lvl{display:flex;flex-direction:column;gap:4px}
.lvl .bar{height:6px;border-radius:3px;background:var(--new-neutral);overflow:hidden}
.lvl .bar i{display:block;height:100%;border-radius:3px}
.lvl .bar i.low{background:var(--green)}.lvl .bar i.med{background:var(--saffron)}.lvl .bar i.high{background:var(--crit)}
.lvl .lt{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.lvl .lt.low{color:var(--green-dark)}.lvl .lt.med{color:#8A5A0E}.lvl .lt.high{color:var(--crit)}
.ev{font-size:12.5px;color:var(--text-secondary)}
.ev .q{margin-top:4px;border-left:3px solid var(--axis);padding:2px 0 2px 9px;color:var(--text-muted);font-style:italic}
.caveat{margin-top:12px;font-size:12px;color:var(--text-muted);border-left:3px solid var(--indigo);background:var(--sand);padding:8px 12px;border-radius:0 3px 3px 0}
/* decision */
.decide{padding:16px 22px;background:#FAFBFF;display:flex;flex-direction:column;gap:10px}
.decide .row{display:flex;gap:8px;flex-wrap:wrap}
.decide textarea{width:100%;min-height:64px;padding:8px 10px;border:1px solid var(--axis);border-radius:3px;font-size:13px;resize:vertical}
.done{padding:16px 22px;display:flex;gap:12px;align-items:center;background:rgba(26,138,90,.07);border-top:1px solid var(--hairline)}
.done b{color:var(--green-dark)}
.log{font-size:12px;color:var(--text-muted);margin-top:6px}
.empty{padding:30px;text-align:center;color:var(--text-muted);font-size:13px}
/* landing */
.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
@media(max-width:800px){.tiles4{grid-template-columns:repeat(2,1fr)}}
.tiles4 .tile{text-align:left;background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:14px 16px;cursor:pointer;border-top:3px solid var(--vista)}
.tiles4 .tile:hover{border-color:var(--ultramarine)}
.tiles4 .tile.overdue{border-top-color:var(--crit)}
.tiles4 .tile.escalated{border-top-color:var(--saffron-dark)}
.tiles4 .tile.hold{border-top-color:var(--saffron)}
.tiles4 .tile.todo{border-top-color:var(--ultramarine)}
.tiles4 .tile .v{font-family:var(--display);font-size:30px;font-weight:700;color:var(--navy);line-height:1.1}
.tiles4 .tile.overdue .v{color:var(--crit)}
.tiles4 .tile .l{font-size:13px;font-weight:700;color:var(--text-primary);margin-top:2px}
.tiles4 .tile .d{font-size:12px;color:var(--text-muted)}
.hi{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:18px;padding:16px 18px;border-bottom:1px solid var(--hairline);align-items:center}
.hi .t{font-weight:700;color:var(--navy);font-size:15px;line-height:1.35}
.hi .m{font-size:12px;color:var(--text-muted);margin-top:2px}
.hi .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.hi .why{font-size:12.5px;color:var(--text-secondary);margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.hi .why .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.dot.ok{background:var(--green)}.dot.warn{background:var(--saffron-dark)}.dot.crit{background:var(--crit)}
.hi .hs{text-align:center}
.hi .tscore2{font-family:var(--display);font-size:26px;font-weight:700;color:var(--navy);line-height:1}
.hi .hs .btn{margin-top:8px;width:100%}
.hfoot{padding:12px 18px;text-align:center}
.hi.si .t{font-size:14px}
.backl{background:none;border:0;padding:0;margin-top:14px;color:var(--ultramarine);font-weight:600;font-size:13px}
.backl:hover{text-decoration:underline}
.ver{font-weight:700;color:var(--navy);background:var(--sand);border-radius:3px;padding:0 5px}
.qnav{display:inline-flex;align-items:center;gap:8px}
.dueL{color:var(--crit);font-weight:700}.dueT{color:var(--saffron-dark);font-weight:700}
.qtabs .tn{opacity:.7;font-weight:700}
.qi .r{align-items:center}
.stbanner{padding:10px 22px;font-size:13px;border-bottom:1px solid var(--hairline)}
.stbanner.esc{background:rgba(180,75,30,.07);color:var(--crit)}
.stbanner.hld{background:var(--saffron-neutral);color:#8A5A0E}
/* specific checks */
.spc{border:1px solid var(--hairline);border-radius:var(--radius);margin-top:8px;background:#fff}
.spc.fail{border-left:4px solid var(--crit)}
.spc.ok{border-left:4px solid var(--green)}
.spc summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
.spc summary::-webkit-details-marker{display:none}
.spc .sn{font-weight:600;color:var(--navy);font-size:14px}
.spc .pill{margin-left:auto}
.spc .chev{width:8px;height:8px;border-right:2px solid var(--text-muted);border-bottom:2px solid var(--text-muted);transform:rotate(45deg);margin:0 4px 3px 4px;transition:transform .15s}
.spc[open] .chev{transform:rotate(-135deg);margin-top:5px}
.spc .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.spc .ic.ok{background:var(--green)}.spc .ic.crit{background:var(--crit)}.spc .ic.mute{background:var(--axis)}
.spb{padding:2px 14px 14px 42px;border-top:1px solid var(--hairline)}
.spl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin:10px 0 4px}
.gate{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:7px 0;font-size:13px;color:var(--text-secondary);line-height:1.5}
.gate b{color:var(--text-primary)}
.spn{margin-top:8px;font-size:12.5px;color:var(--text-muted);border-left:3px solid var(--axis);padding-left:10px}
/* ---- AI-led screening ---- */
:root{--amber:#C77700;--red:#C0262D}
.ragstrip{display:inline-flex;gap:4px;margin-left:auto}
.rg{min-width:22px;height:22px;border-radius:11px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;padding:0 6px}
.rg.g{background:var(--green)}.rg.a{background:var(--amber)}.rg.r{background:var(--red)}
.aib{padding:18px 22px;border-bottom:1px solid var(--hairline);background:rgba(26,138,90,.05)}
.aib.a{background:rgba(199,119,0,.06)}
.aib.r{background:rgba(192,38,45,.05)}
.aih{display:flex;gap:14px;align-items:flex-start}
.aia{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.aih h3{font-size:16px;color:var(--navy);line-height:1.35}
.aih p{margin:3px 0 0;font-size:13px}
.aic{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.aik{background:#fff;border:1px solid var(--hairline);border-top:4px solid var(--green);border-radius:var(--radius);padding:10px 14px}
.aik.a{border-top-color:var(--amber)}.aik.r{border-top-color:var(--red)}
.aik b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;color:var(--navy)}
.aik.a b{color:var(--amber)}.aik.r b{color:var(--red)}
.aik span{font-size:12px;color:var(--text-muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--text-muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend i.g{background:var(--green)}.legend i.a{background:var(--amber)}.legend i.r{background:var(--red)}
.rc{border:1px solid var(--hairline);border-left:5px solid var(--amber);border-radius:var(--radius);margin-top:10px;background:#fff}
.rc.r{border-left-color:var(--red)}
.rc.handled{opacity:.8;border-left-color:var(--green)}
.rch{display:flex;align-items:center;gap:12px;padding:12px 16px}
.rdot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.rdot.a{background:var(--amber)}.rdot.r{background:var(--red)}
.rct{flex:1;min-width:0}
.rcn{font-weight:700;color:var(--navy);font-size:14.5px}
.rcs{font-size:12px;color:var(--text-muted)}
.rcb{padding:0 16px 14px 54px}
.rrow{font-size:13px;line-height:1.55;color:var(--text-secondary);margin-top:9px}
.rrow b{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin-bottom:1px}
.rrow ul{margin:2px 0 0;padding-left:18px}
.rrow .q{margin-top:4px;border-left:3px solid var(--axis);padding-left:9px;color:var(--text-muted);font-style:italic}
.racts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tfail{display:flex;align-items:center;gap:12px;margin-top:2px;padding:10px 14px;border-radius:var(--radius);background:rgba(192,38,45,.07)}
.tfail .tf{font-family:var(--display);font-size:26px;font-weight:700;color:var(--red);line-height:1}
.tfail .tfx{font-size:13px;color:var(--text-secondary)}
table.gt{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}
table.gt th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);padding:6px 8px;border-bottom:1px solid var(--hairline)}
table.gt td{padding:9px 8px;border-bottom:1px solid var(--hairline);vertical-align:top;color:var(--text-secondary)}
table.gt tr.gtstuck td{background:rgba(192,38,45,.05)}
.gic{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.gic.g{background:var(--green)}.gic.r{background:var(--red)}.gic.m{background:var(--axis)}
.gatemsg{font-size:13px;font-weight:600;padding:8px 12px;border-radius:var(--radius);margin-bottom:10px}
.gatemsg.r{background:rgba(192,38,45,.08);color:var(--red)}.gatemsg.a{background:rgba(199,119,0,.1);color:#8A5A0E}
.dn summary{list-style:none;display:flex;align-items:center;cursor:pointer}
.dn summary::-webkit-details-marker{display:none}
.dn .chev{width:8px;height:8px;border-right:2px solid var(--text-muted);border-bottom:2px solid var(--text-muted);transform:rotate(45deg);margin:0 4px 3px auto;transition:transform .15s}
.dn[open] .chev{transform:rotate(-135deg);margin-top:5px}
.glist{margin-top:10px}
.gi{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-top:1px solid var(--hairline)}
.gi .gm{flex:1;font-size:13px;color:var(--text-primary)}
.gi .gm span{display:block;font-size:12px;color:var(--text-muted)}
.gi .gc{font-size:11.5px;font-weight:700;color:var(--green-dark);white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* lean report */
.rhd{padding:16px 22px 12px}
.rhd .meta{margin-top:4px}
.aib{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 22px}
.aib .aia{width:30px;height:30px;border-radius:8px;font-size:12px}
.aib .aix{flex:1;min-width:200px}
.aib .aix b{font-size:15px;color:var(--navy)}
.aic2{display:flex;gap:14px;font-size:12.5px;color:var(--text-secondary)}
.aic2 span{display:inline-flex;align-items:center;gap:5px}
.aic2 .rg{font-style:normal}
.rws{padding:6px 22px 10px}
.rw{border:1px solid var(--hairline);border-radius:var(--radius);margin-top:8px;background:#fff}
.rw summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.rw summary::-webkit-details-marker{display:none}
.rw .rdot{width:22px;height:22px;font-size:12px}
.rw .rdot.g{background:var(--green)}
.rw .rcn{font-weight:700;color:var(--navy);font-size:14px;white-space:nowrap}
.rw .rcf{flex:1;min-width:0;font-size:12.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  function soon(msg){ var el = $("toast"); if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); } el.textContent = msg; el.classList.add("on"); clearTimeout(soon.t); soon.t = setTimeout(function(){ el.classList.remove("on"); }, 2600); }
  function navCur(home){ $("navDash").toggleAttribute("aria-current", home); $("navScr").toggleAttribute("aria-current", !home); if (!home) $("navScr").setAttribute("aria-current", "page"); else $("navDash").setAttribute("aria-current", "page"); }
  function undecided(){ var s = state.view === "detail" && bySel(); return !!(s && (group(s) === "overdue" || group(s) === "todo")); }
  function inSession(){ return !!state.session && undecided(); }
  function renderSession(){
    var on = inSession(), act = undecided(), sb = $("sBar"), ab = $("aBar");
    sb.hidden = !on; ab.hidden = true; document.body.classList.toggle("flow", on);
    $("decCard").hidden = !act; $("dLay").classList.toggle("one", !act);
    if (!act) return;
    var s = bySel(), q = actionable(), i = q.indexOf(s), prev = q[i - 1], next = q[i + 1], w = dueW(s);
    if (on) {
    var nb = function(x, lab){ return '<button type="button" class="btn sm" data-snav="' + (x ? x.id : "") + '"' + (x ? "" : " disabled") + '>' + lab + '</button>'; };
    sb.innerHTML = '<div class="in"><div class="st1"><div class="t1">Screen new submissions</div><div class="t2">' + (i + 1) + ' of ' + q.length + ' &middot; ' + s.j + ' &middot; <span class="' + w[1] + '">' + w[0] + '</span></div></div>' +
      '<div class="scrnav">' + nb(prev, "Previous") + nb(next, "Next") + '</div><button type="button" class="btn sm" data-go="">Back to dashboard</button></div>' +
      '<div class="bar"><i style="width:' + Math.round(i / q.length * 100) + '%"></i></div>';
    }
    if (on) $("pHead").hidden = true; else sb.innerHTML = "";
    var dec = $("report").querySelector(".decide"); if (dec) dec.parentNode.removeChild(dec);
    renderDec();
  }
  function go(h){ if ((location.hash || "").slice(1) === h) route(); else location.hash = h; }
  function route(){
    var h = (location.hash || "").slice(1);
    if (h === "screening" || h === "queue") { state.view = "list"; state.ltab = "todo"; }
    else if (h === "screened") { state.view = "list"; state.ltab = "done"; }
    else if (h && SUBS.some(function(s){ return s.id === h; })) { state.view = "detail"; state.sel = h; }
    else if (h && GL[h]) { state.view = "list"; state.ltab = h === "overdue" || h === "todo" ? "todo" : "done"; }
    else state.view = "home";
    if (FL) DRAFTS[FL.id] = FL; FL = null; if (state.view === "detail" && state.sel) seen[state.sel] = 1; if (state.justDone && state.justDone !== state.sel) state.justDone = null; if (state.view !== "detail") state.justDone = null; if (state.view !== "detail") closeMs(); render(); if (window.scrollTo) window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  function render(){
    var v = state.view;
    $("vHome").hidden = v !== "home"; $("vList").hidden = v !== "list"; $("vQueue").hidden = v !== "detail";
    if (v === "home") renderHome(); else if (v === "list") renderList(); else { renderQueue(); renderReport(); }
    renderSession();
    var pip = $("navPip"), n = actionable().length; if (pip) { pip.textContent = n || ""; pip.hidden = !n; }
  }
  function openQueue(filter, id){
    state.view = "detail"; state.filter = filter || "all";
    var l = list();
    state.sel = id || (l[0] && l[0].id) || null;
    if (state.sel && !l.some(function(s){ return s.id === state.sel; })) state.filter = "all";
    render(); if (window.scrollTo) window.scrollTo(0, 0);
  }

  document.addEventListener("click", function(e){
    var t = e.target, q = t.closest(".qi"), f = t.closest("[data-f]"), d = t.closest("[data-do]"),
        tl = t.closest("[data-tile]"), op = t.closest("[data-open]");
    if (t.closest("[data-flcancel]")) { closeFlow(); return; }
    if (t.closest("[data-flok]")) { if (FL && flowOK()) flowConfirm(); return; }
    if (t.closest("[data-viewrep]")) { state.justDone = null; render(); if (window.scrollTo) window.scrollTo(0, 0); return; }
    var stb = t.closest("[data-start]"); if (stb) { state.session = true; go(stb.getAttribute("data-start")); return; }
    var snb = t.closest("[data-snav]"); if (snb) { if (snb.getAttribute("data-snav")) go(snb.getAttribute("data-snav")); return; }
    var gg = t.closest("[data-go]");
    if (gg && !e.metaKey && !e.ctrlKey) { e.preventDefault(); state.session = false; go(gg.getAttribute("data-go")); return; }
    if ((t.closest("#logoHome") || t.closest("#navDash")) && !e.metaKey && !e.ctrlKey) { e.preventDefault(); go(""); return; }
    var lt = t.closest("[data-ltab]"); if (lt) { go(lt.getAttribute("data-ltab") === "done" ? "screened" : "screening"); return; }
    var sfb = t.closest("[data-sf]"); if (sfb && !sfb.disabled) { state.sf = sfb.getAttribute("data-sf"); render(); return; }
    var ab = t.closest("#acctBtn"), mn = $("acctMenu");
    if (ab) { var on = !mn.classList.contains("on"); mn.classList.toggle("on", on); ab.setAttribute("aria-expanded", on); return; }
    if (mn && !t.closest("#acctMenu")) { mn.classList.remove("on"); $("acctBtn").setAttribute("aria-expanded", "false"); }
    var sn = t.closest("[data-soon]"); if (sn) { e.preventDefault(); soon(sn.getAttribute("data-soon") + " isn\u2019t part of this prototype."); return; }
    if (t.closest("#openMs")) { openMs(); return; }
    if (t.closest("#openMeta")) { openMeta(); return; }
    var tk = state.sel + "|trust";
    if (t.closest("[data-tpass]")) { res[tk] = "pass"; failOpen[tk] = false; render(); return; }
    if (t.closest("[data-tfail]")) { failOpen[tk] = true; render(); var fw = $("failWhy"); if (fw) fw.focus(); return; }
    if (t.closest("[data-tcancel]")) { failOpen[tk] = false; render(); return; }
    if (t.closest("[data-tconfirm]")) {
      var fv = ($("failWhy").value || "").trim();
      if (!fv) { $("failWhy").focus(); return; }
      failText[tk] = fv; res[tk] = "fail"; failOpen[tk] = false; render(); return;
    }
    var rsb = t.closest("[data-res]"), unb = t.closest("[data-undo]");
    if (rsb) { res[state.sel + "|" + rsb.getAttribute("data-c")] = rsb.getAttribute("data-res"); render(); return; }
    if (unb) { delete res[state.sel + "|" + unb.getAttribute("data-undo")]; render(); return; }
    if (op) { state.session = false; go(op.getAttribute("data-open")); }
    else if (d) {
      openFlow(d.getAttribute("data-do"));
    }
    else if (t.id === "undo") { delete outcomes[state.sel]; delete info[state.sel]; state.justDone = null; render(); }
  });

  document.addEventListener("keydown", function(e){ if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-open]")) { e.preventDefault(); state.session = false; go(e.target.getAttribute("data-open")); } });
  document.addEventListener("change", function(e){
    var t = e.target; if (!t || !t.closest || !t.closest("#decCard")) return;
    var k = t.getAttribute("data-dec"); if (k) { if (!FL || FL.k !== k) openFlow(k); return; }
    flowInput(t);
  });
  document.addEventListener("input", function(e){
    if (e.target && e.target.getAttribute && e.target.getAttribute("data-flt")) { flowInput(e.target); return; }
    if (!e.target || e.target.id !== "failWhy") return;
    var k = state.sel + "|trust"; failText[k] = e.target.value;
    var b = document.querySelector("[data-tconfirm]"); if (b) b.disabled = !e.target.value.trim();
  });
  route();
})();
</script>
</body>
</html>
